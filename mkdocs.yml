site_name: Fireworks Mania Mod Tools
site_url: https://laumania.github.io/FireworksMania.ModTools/
site_description: Documentation for creating mods for Fireworks Mania using the Fireworks Mania Mod Tools for Unity.
site_author: Laumania ApS
repo_url: https://github.com/Laumania/FireworksMania.ModTools
repo_name: Laumania/FireworksMania.ModTools
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tooltips

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
    - guides/index.md
    - Editor Menu Reference: guides/editor-tools.md
    - Templates & Sample Assets: guides/templates-and-samples.md
    - Icons & Sounds: guides/icons-and-sounds.md
    - Custom Maps: guides/custom-maps.md
    - Troubleshooting & Build Errors: guides/troubleshooting.md
    - Publishing Your Mod: guides/publishing.md
    - Best Practices: best-practices.md
    - Optimization: optimization.md
  - Scripting:
    - scripting/index.md
    - Setting Up Scripts in a Mod: scripting/setup.md
    - Entry Points & Lifecycle: scripting/entry-points.md
    - Writing a Custom Firework: scripting/custom-fireworks.md
    - Multiplayer & Netcode: scripting/networking.md
    - The Messenger Event Bus: scripting/messaging.md
    - Saving & Loading: scripting/persistence.md
    - Services & Interfaces: scripting/services-and-interfaces.md
  - Script Reference:
    - script-reference/index.md
    - Definitions: script-reference/definitions.md
    - Behaviors: script-reference/behaviors.md
    - Firework Parts: script-reference/firework-parts.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

plugins:
  - search
